name: Feature request
description: Suggest an improvement to the SideShift MCP plugin package.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the user workflow and why the current plugin experience is insufficient.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed improvement
      description: Explain the desired behavior without including private company or creator data.
    validations:
      required: true
